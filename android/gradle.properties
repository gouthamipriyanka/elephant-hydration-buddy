org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Per-environment backend URLs (non-secret). Override in ~/.gradle/gradle.properties or CI. ----
ellie.backend.dev=http://10.0.2.2:8080
ellie.backend.qa=https://hydration-buddy-qa.example.com
ellie.backend.uat=https://hydration-buddy-uat.example.com
