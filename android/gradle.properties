org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Per-environment backend URLs (non-secret). BLANK = standalone mode (no server, no WHOOP). ----
# Phase 1 ships standalone. Set a https URL here (or via CI -P) to enable WHOOP later.
ellie.backend.dev=http://10.0.2.2:8080
ellie.backend.qa=
ellie.backend.uat=
ellie.backend.prod=

# ---- Firebase (public client identifiers, NOT secrets; still keep per-env). Blank = push disabled. ----
ellie.firebase.appId=
ellie.firebase.apiKey=
ellie.firebase.projectId=
ellie.firebase.senderId=

# ---- Personalisation shown on the welcome screen ----
ellie.fromName=Your loving wife
