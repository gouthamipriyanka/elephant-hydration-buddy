name: Release APK

# Manual: Actions tab -> "Release APK" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: prod   # add required reviewers on this environment for an approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore signing key from secrets (never written to logs)
        env:
          KEYSTORE_B64: ${{ secrets.ELLIE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ELLIE_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ellie.jks"
          echo "ELLIE_KEYSTORE_PATH=$RUNNER_TEMP/ellie.jks" >> "$GITHUB_ENV"
      - name: Test + build signed prod APK
        working-directory: android
        env:
          ELLIE_KEYSTORE_PASSWORD: ${{ secrets.ELLIE_KEYSTORE_PASSWORD }}
          ELLIE_KEY_ALIAS: ${{ secrets.ELLIE_KEY_ALIAS }}
          ELLIE_KEY_PASSWORD: ${{ secrets.ELLIE_KEY_PASSWORD }}
        run: gradle --no-daemon -PellieVersionCode=${{ github.run_number }} testProdReleaseUnitTest lintProdRelease assembleProdRelease
      - name: Verify signature and checksum
        working-directory: android/app/build/outputs/apk/prod/release
        run: |
          APK=$(ls *.apk)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          mv "$APK" ellie-${{ github.run_number }}.apk
          sha256sum ellie-*.apk | tee SHA256SUMS.txt
      - name: Remove key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/ellie.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ellie-prod-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/prod/release/ellie-*.apk
            android/app/build/outputs/apk/prod/release/SHA256SUMS.txt
          retention-days: 30
