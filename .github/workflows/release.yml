name: Release APK

# Manual: Actions tab -> "Release APK" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decrypt signing key (never written to logs)
        env:
          PASS: ${{ secrets.ELLIE_SIGNING_PASSPHRASE }}
        run: |
          test -f android/signing/ellie.jks.gpg || { echo "::error::Run the 'Init signing key' workflow first"; exit 1; }
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            -d -o "$RUNNER_TEMP/ellie.jks" android/signing/ellie.jks.gpg
          echo "ELLIE_KEYSTORE_PATH=$RUNNER_TEMP/ellie.jks" >> "$GITHUB_ENV"
      - name: Test + build signed prod APK
        working-directory: android
        env:
          ELLIE_KEYSTORE_PASSWORD: ${{ secrets.ELLIE_SIGNING_PASSPHRASE }}
        run: gradle --no-daemon -PellieVersionCode=${{ github.run_number }} testProdReleaseUnitTest lintProdRelease assembleProdRelease
      - name: Verify signature and checksum
        working-directory: android/app/build/outputs/apk/prod/release
        run: |
          APK=$(ls *.apk)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          mv "$APK" ellie-${{ github.run_number }}.apk
          sha256sum ellie-*.apk | tee SHA256SUMS.txt
      - name: Remove key from runner
        if: always()
        run: shred -u "$RUNNER_TEMP/ellie.jks" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: ellie-prod-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/prod/release/ellie-*.apk
            android/app/build/outputs/apk/prod/release/SHA256SUMS.txt
          retention-days: 30
