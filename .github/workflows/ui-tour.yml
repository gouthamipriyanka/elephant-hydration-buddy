name: UI tour (real emulator screenshots)

# Boots a real Android emulator, installs the QA build, taps through the app and
# publishes screenshots to the 'screenshots' branch (gallery: screenshots/README.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ci-tools/**"
      - ".github/workflows/ui-tour.yml"

permissions:
  contents: write

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build QA debug APK
        working-directory: android
        run: gradle --no-daemon assembleQaDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci-tools/ui_tour.sh
      - name: Publish screenshots to 'screenshots' branch
        if: always()
        run: |
          set -e
          [ -d shots ] && ls shots/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          mkdir /tmp/pub && cp shots/*.png /tmp/pub/
          cd /tmp/pub
          { echo "# Ellie: real emulator screenshots"; echo; echo "Commit: ${GITHUB_SHA::7} · Android 14 emulator (Pixel 6)"; echo
            for f in *.png; do echo "### ${f%.png}"; echo; echo "<img src=\"$f\" width=\"320\">"; echo; done; } > README.md
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "UI tour screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
