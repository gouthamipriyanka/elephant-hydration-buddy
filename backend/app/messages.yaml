# Health facts. Each has a source; keep wording faithful to the source.
# Sources were checked on 2026-11-09 via web search (pages may change; re-verify periodically).
facts:
  - text: "Did you know? Getting enough water every day helps your body function normally and prevents dehydration."
    source: "CDC - About Water and Healthier Drinks"
    source_url: "https://www.cdc.gov/healthy-weight-growth/water-healthy-drinks/index.html"
  - text: "Did you know? Dehydration can cause unclear thinking and mood changes. Water keeps your mind sharp!"
    source: "CDC - About Water and Healthier Drinks"
    source_url: "https://www.cdc.gov/healthy-weight-growth/water-healthy-drinks/index.html"
  - text: "Did you know? Not drinking enough water is linked to overheating, constipation and kidney stones."
    source: "CDC - About Water and Healthier Drinks"
    source_url: "https://www.cdc.gov/healthy-weight-growth/water-healthy-drinks/index.html"
  - text: "Did you know? Water has zero calories, so swapping a sugary drink for water is an easy healthy win."
    source: "CDC - About Water and Healthier Drinks"
    source_url: "https://www.cdc.gov/healthy-weight-growth/water-healthy-drinks/index.html"
  - text: "Did you know? Every cell, tissue and organ in your body needs water to work properly."
    source: "Mayo Clinic - Water: How much should you drink every day?"
    source_url: "https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/in-depth/water/art-20044256"
  - text: "Did you know? Even mild dehydration can drain your energy and make it harder to think clearly."
    source: "Mayo Clinic - Water: How much should you drink every day?"
    source_url: "https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/in-depth/water/art-20044256"
  - text: "Did you know? You need more fluid when you exercise, sweat, or it's hot. Extra sips on sports days!"
    source: "Mayo Clinic - Water: How much should you drink every day?"
    source_url: "https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/in-depth/water/art-20044256"
  - text: "Did you know? Rarely feeling thirsty and pale yellow urine are good signs you're drinking enough."
    source: "Mayo Clinic - Water: How much should you drink every day?"
    source_url: "https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/in-depth/water/art-20044256"
  - text: "Did you know? The UK Eatwell Guide suggests about 6 to 8 glasses of fluid a day, more when it's hot."
    source: "NHS - Water, drinks and hydration"
    source_url: "https://www.nhs.uk/live-well/eat-well/food-guidelines-and-food-labels/water-drinks-nutrition/"
  - text: "Did you know? Water helps keep your body temperature normal and cushions your joints."
    source: "Michigan State University Extension (citing CDC) - Make water your beverage of choice"
    source_url: "https://www.canr.msu.edu/news/make_water_your_beverage_of_choice"
