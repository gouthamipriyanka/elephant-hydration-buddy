# Ellie the Elephant's message pools.
# RULES (enforced by app/messages.py and the Android app):
#   * Plain text only. No URLs/links in any message text (anti-phishing).
#   * Max 200 characters per message.
#   * Edit freely! Add your own lines to any pool.
# "{name}" is replaced with his nickname from settings (optional).

